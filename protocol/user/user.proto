syntax = "proto3";

package protocol.user;

// ============================================================
//  user.proto —— 用户域
//
//  定位: 账号认证、连接心跳、用户资料、好友系统。
//  与 chat.proto 的关系: chat.proto 通过 import 复用本文件的
//  共享类型(ErrCode / UserInfo)。
//
//  说明: 本文件按『demo 可跑 + 未来可扩』设计。
//    - demo 必需: Register / Login / Logout / Heartbeat
//    - 好友系统: 申请 + 手动回复消息 (FriendRequest / FriendPendingList)
//    - 未来扩展(已定义占位, 暂不实现): Cancel / 好友列表/搜索/通知 / UserStatusNotify
//
//  兼容性约束: proto3 字段号不可复用, 新增字段只能向后追加。
//  未来新增用户侧能力时, 在此文件追加 message + UserPacket 分支,
//  不要改动已发布字段的编号与语义。
// ============================================================

// 共享错误码 —— 被 chat 等其它域 import 使用
enum ErrCode {
  ERR_SUCCESS        = 0;
  ERR_SYSTEM         = 1;
  ERR_INVALID_PARAM  = 2;
  ERR_INVALID_USER   = 3;   // 用户名或密码错误 / 用户不存在
  ERR_USER_EXISTS    = 4;
  ERR_NOT_LOGGED_IN  = 5;
  ERR_FULL           = 6;   // 连接数/在线数已满
  ERR_NOT_FRIEND     = 7;
  ERR_ALREADY_FRIEND = 8;
  ERR_BLOCKED        = 9;
  ERR_REQUEST_PENDING = 10;  // 已有未处理的加好友申请 (防重复申请)
  ERR_GROUP_NOT_FOUND  = 11;  // 群不存在
  ERR_NOT_GROUP_MEMBER = 12;  // 不是群成员
  ERR_NOT_GROUP_ADMIN  = 13;  // 需群主/管理员权限
  ERR_NOT_GROUP_OWNER  = 14;  // 需群主权限
  ERR_ALREADY_IN_GROUP = 15;  // 已是群成员或申请已提交
  // 未来: ERR_OFFLINE / ERR_TOO_FREQUENT / ERR_FORBIDDEN ...
}

// 用户公开信息
message UserInfo {
  uint32 user_id    = 1;
  string nickname   = 2;   // max 64
  uint64 created_at = 3;  
  bool   online     = 4;   
}
// ------------------------------------------------------------     
// ------------------------------------------------------------

// 注册
message RegisterRequest {
  string username = 1;   // max 64
  string password = 2;   // max 64
  string nickname = 3;   // max 64
}

message RegisterResponse {
  ErrCode  err     = 1;
  uint32   user_id = 2;
}

// 登录
message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  ErrCode  err     = 1;
  uint32   user_id = 2;
  UserInfo user    = 3;   // 登录成功时带回完整用户信息
}

// 登出
message LogoutRequest {
  uint32 user_id = 1;
}

message LogoutResponse {
  ErrCode err = 1;
}

// 注销账号 (未来扩展占位)
message CancelRequest {
  string username = 1;
  string password = 2;
}

message CancelResponse {
  ErrCode err = 1;
}

// ------------------------------------------------------------
//  心跳 (demo 必需, 连接保活)
// ------------------------------------------------------------

message HeartbeatReq  {}
message HeartbeatResp {}

// ------------------------------------------------------------
//  好友系统 —— 申请 + 手动回复消息
//
//  流程: A 向 B 发起申请 → B 拉取待处理列表 → B 向 A 手动发送
//  一条聊天消息即视为接受 (服务器侧据此建立好友关系)。
//  好友列表(FriendListRequest)列出已建立的好友关系(含在线状态)。
//  重复申请命中 ERR_REQUEST_PENDING。
// ------------------------------------------------------------

// 发起加好友申请
message FriendRequestRequest {
  uint32 friend_id = 1;
  string remark    = 2;   // 验证消息, max 128
}

message FriendRequestResponse {
  ErrCode  err       = 1;
  uint32   friend_id = 2;
}

// 待处理申请列表 (别人申请了我, 待我处理)
message FriendPendingListRequest {}

message FriendPendingItem {
  uint32 friend_id = 1;
  string nickname  = 2;
  string remark    = 3;
  uint64 ts        = 4;   // 申请时间 (unix 秒)
}

message FriendPendingListResponse {
  repeated FriendPendingItem items = 1;
  ErrCode err                    = 2;   // 错误码(与其它响应保持一致)
}

// 好友列表 (仿 group 域的 GroupListRequest: 列出所有已建立的好友关系)
message FriendListRequest {}

message FriendListItem {
  uint32   user_id  = 1;
  string   nickname = 2;
  bool     online   = 3;   // 在线状态
}

message FriendListResponse {
  ErrCode                    err     = 1;
  repeated FriendListItem    friends = 2;
}

// 删除好友
message FriendDelRequest {
  uint32 friend_id = 1;
}

message FriendDelResponse {
  ErrCode err = 1;
}

// 拉黑 / 取消拉黑
message FriendBlockRequest {
  uint32 friend_id = 1;
  bool   block     = 2;
}

message FriendBlockResponse {
  ErrCode err = 1;
}

// ------------------------------------------------------------
//  系统 / 在线状态推送 (未来扩展)
// ------------------------------------------------------------

message SystemNotify {
  string content = 1;   // max 256
}

message UserStatusNotify {
  uint32 user_id = 1;
  bool   online  = 2;
}

// ------------------------------------------------------------
//  用户域信封 —— 统一本域消息的分派与反序列化
// ------------------------------------------------------------
message UserPacket {
  oneof body {
    RegisterRequest     register_req      = 1;
    RegisterResponse    register_resp     = 2;
    LoginRequest        login_req         = 3;
    LoginResponse       login_resp        = 4;
    LogoutRequest       logout_req        = 5;
    LogoutResponse      logout_resp       = 6;
    CancelRequest       cancel_req        = 7;
    CancelResponse      cancel_resp       = 8;
    HeartbeatReq        heartbeat_req          = 9;
    HeartbeatResp       heartbeat_resp         = 10;
    FriendRequestRequest    friend_request_req     = 11;
    FriendRequestResponse   friend_request_resp    = 12;
    FriendPendingListRequest  friend_pending_list_req  = 13;
    FriendPendingListResponse friend_pending_list_resp = 14;
    FriendDelRequest    friend_del_req        = 15;
    FriendDelResponse   friend_del_resp       = 16;
    FriendBlockRequest  friend_block_req      = 19;
    FriendBlockResponse friend_block_resp     = 20;
    SystemNotify        system_notify         = 21;
    UserStatusNotify    user_status_notify    = 22;
    FriendListRequest   friend_list_req       = 23;
    FriendListResponse  friend_list_resp      = 24;
  }
}
